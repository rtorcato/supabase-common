name: 🚀 Release

# On demand only, never per merge: a dispatch (hotfix, ad hoc) or a closed
# milestone ("ship this batch"). Same shape as rtorcato/react-common. This is
# the only workflow that publishes; ci.yml no longer does.
on:
  workflow_dispatch:
  milestone:
    types: [closed]

# Queue rather than cancel: a newer run waits for the one ahead of it (approval
# included) instead of killing a publish already in flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Publish only from the default branch; a dispatch from any other branch is
    # skipped. The `release` environment adds a required-reviewer gate on top.
    if: github.event_name == 'milestone' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # Holds every run until a required reviewer approves it. The npm trusted
    # publishers must name release.yml and this environment, or the OIDC
    # publish fails with E404.
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7
        with:
          # The tip, not the event's SHA: the job starts after approval, and
          # main may have moved on while it waited.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # RELEASE_TOKEN (admin PAT) lets the Changesets action push the
          # "Version Packages" PR / version commit past branch protection;
          # GITHUB_TOKEN can't. Falls back to GITHUB_TOKEN when no PAT is set.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      # Build so `changeset publish`'s `npm publish` ships each package's dist
      # (files: ["dist"]). Provenance comes from the root .npmrc (provenance=true)
      # + id-token: write.
      - name: 🏗️ Build packages
        run: pnpm build

      # OIDC trusted publishing needs npm CLI >= 11.5.1; the runner ships 10.x.
      - name: 📦 Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      # With pending changesets this opens or updates the "Version Packages" PR
      # and publishes nothing. Merging that PR publishes nothing either; the
      # next dispatch or milestone close (approved) publishes the bumped packages.
      # v2 needs Changesets CLI v3 and reads published packages from the
      # CHANGESETS_OUTPUT file it passes down, not from stdout; v1 can't, so it
      # would publish without tags or GitHub releases. v2 only takes a custom
      # token through `github-token`, never the GITHUB_TOKEN env.
      - name: 🚀 Changesets — version PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm changeset publish
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
